<link
  rel="stylesheet"
  href="/themes/core/static/css/labs.css"
>

<div
  id="labs-modal-backdrop"
  class="labs-backdrop"
  data-labs-close
  hidden
></div>

<section
  id="labs-modal"
  class="labs-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="labs-modal-title"
  hidden
>
  <header class="labs-modal-header" data-labs-drag-handle>
    <div class="labs-title-group">
      <span class="labs-status-dot" aria-hidden="true"></span>
      <div>
        <h2 id="labs-modal-title" class="labs-title">Labs</h2>
        <p id="labs-modal-subtitle" class="labs-subtitle">Temporary Linux workspace</p>
      </div>
    </div>

    <div class="labs-header-actions">
      <button
        id="labs-launch-button"
        class="btn btn-primary btn-sm labs-launch-button"
        type="button"
      >
        Launch Lab
      </button>
      <button
        id="labs-close-button"
        class="btn btn-outline-secondary btn-sm labs-icon-button"
        type="button"
        aria-label="Close Labs"
        data-labs-close
      >
        &times;
      </button>
    </div>
  </header>

  <div class="labs-modal-body">
    <div id="labs-empty-state" class="labs-empty-state">
      <div class="labs-empty-icon" aria-hidden="true">&gt;_</div>
      <h3>Linux lab ready on demand</h3>
      <p>Launch a temporary terminal workspace. The terminal will appear here automatically.</p>
    </div>

    <div id="labs-loading-state" class="labs-loading-state" hidden>
      <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
      <div>
        <h3>Provisioning lab</h3>
        <p>Cloning the template, starting networking, and preparing ttyd.</p>
      </div>
    </div>

    <div id="labs-error-state" class="labs-error-state alert alert-danger" role="alert" hidden></div>

    <div id="labs-terminal-shell" class="labs-terminal-shell" hidden>
      <div class="labs-terminal-toolbar">
        <div class="labs-terminal-meta">
          <span id="labs-terminal-host">Terminal</span>
          <span id="labs-terminal-expiry" class="labs-terminal-expiry"></span>
        </div>
        <span id="labs-terminal-status" class="badge badge-success">Connected</span>
      </div>
      <iframe
        id="labs-terminal-frame"
        class="labs-terminal-frame"
        title="Embedded Linux lab terminal"
        allow="clipboard-read; clipboard-write"
      ></iframe>
    </div>
  </div>

  <span class="labs-resize-handle" aria-hidden="true"></span>
</section>

<script
  defer
  src="/themes/core/static/js/labs.js"
></script>

<script>
(function () {
  "use strict";

  function find(selector) {
    return document.querySelector(selector);
  }

  function setHidden(selector, hidden) {
    var element = find(selector);
    if (element) {
      element.hidden = hidden;
    }
  }

  function openLabs(event) {
    if (event && event.preventDefault) {
      event.preventDefault();
    }
    setHidden("#labs-modal-backdrop", false);
    setHidden("#labs-modal", false);
    document.body.classList.add("labs-modal-open");
  }

  function closeLabs(event) {
    if (event && event.preventDefault) {
      event.preventDefault();
    }
    setHidden("#labs-modal-backdrop", true);
    setHidden("#labs-modal", true);
    document.body.classList.remove("labs-modal-open");
  }

  function show(selector) {
    setHidden(selector, false);
  }

  function hide(selector) {
    setHidden(selector, true);
  }

  function text(selector, value) {
    var element = find(selector);
    if (element) {
      element.textContent = value || "";
    }
  }

  function showTerminal(lab) {
    hide("#labs-empty-state");
    hide("#labs-loading-state");
    hide("#labs-error-state");
    show("#labs-terminal-shell");
    text("#labs-modal-subtitle", "Lab " + (lab.ctid || "") + " is ready");
    text("#labs-terminal-host", lab.ip_address ? lab.ip_address + ":7681" : "Terminal");
    text("#labs-terminal-expiry", lab.expires_in ? "Expires in " + lab.expires_in : "");

    var frame = find("#labs-terminal-frame");
    if (frame && lab.terminal_url) {
      frame.src = lab.terminal_url;
    }

    var button = find("#labs-launch-button");
    if (button) {
      button.disabled = false;
      button.textContent = "Reconnect";
    }
  }

  function showError(message) {
    hide("#labs-empty-state");
    hide("#labs-loading-state");
    hide("#labs-terminal-shell");
    show("#labs-error-state");
    text("#labs-error-state", message || "Unable to launch lab. Please try again.");
    text("#labs-modal-subtitle", "Unable to launch lab");

    var button = find("#labs-launch-button");
    if (button) {
      button.disabled = false;
      button.textContent = "Try Again";
    }
  }

  function launchLab(event) {
    if (event && event.preventDefault) {
      event.preventDefault();
    }

    var button = find("#labs-launch-button");
    if (button) {
      button.disabled = true;
      button.textContent = "Launching...";
    }

    hide("#labs-empty-state");
    hide("#labs-error-state");
    hide("#labs-terminal-shell");
    show("#labs-loading-state");
    text("#labs-modal-subtitle", "Provisioning lab environment");

    fetch("/spawn", {
      method: "GET",
      credentials: "same-origin",
      headers: { Accept: "application/json" }
    })
      .then(function (response) {
        if (!response.ok) {
          throw new Error("The lab service returned HTTP " + response.status + ".");
        }
        return response.json();
      })
      .then(function (lab) {
        if (!lab || !lab.terminal_url) {
          throw new Error("The lab service did not return a terminal URL.");
        }
        showTerminal(lab);
      })
      .catch(function (error) {
        showError(error.message || String(error));
      });
  }

  window.CyberLabsFallbackOpen = openLabs;

  document.addEventListener("DOMContentLoaded", function () {
    setTimeout(function () {
      if (window.CyberLabsReady) {
        return;
      }

      var openButton = find("#labs-open-button");
      var launchButton = find("#labs-launch-button");

      if (openButton) {
        openButton.addEventListener("click", openLabs);
      }
      if (launchButton) {
        launchButton.addEventListener("click", launchLab);
      }
      document.querySelectorAll("[data-labs-close]").forEach(function (button) {
        button.addEventListener("click", closeLabs);
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          closeLabs(event);
        }
      });
    }, 250);
  });
})();
</script>
